name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri links the webkit/gtk stack even to type-check, and the core
      # uses GIO. Linux build dependencies only — the apps target Arch.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: npx -y pnpm@11.13.0 install --frozen-lockfile

      - name: Typecheck, lint, format, unit tests
        run: |
          npx -y pnpm@11.13.0 typecheck
          npx -y pnpm@11.13.0 lint
          npx -y pnpm@11.13.0 format:check
          npx -y pnpm@11.13.0 test

      # `tauri build` (the release, makepkg) refuses npm packages and Rust
      # crates on different major.minor — this job never runs it, so a
      # floating `^` on @tauri-apps/* once passed CI and failed the package
      # build (ewe-sync v0.15.0-beta, 2026-10-31). Same rule, checked early.
      - name: Tauri npm and Rust versions agree
        run: |
          python3 - <<'PY'
          import re, subprocess, json
          cargo = open("Cargo.lock").read()
          def crate(name):
              m = re.search(r'name = "%s"\nversion = "([^"]+)"' % re.escape(name), cargo)
              return m.group(1) if m else None
          out = subprocess.check_output(["npx", "-y", "pnpm@11.13.0", "--filter", "ewe-viewer", "list", "--json", "--depth", "0"], text=True)
          deps = {}
          for proj in json.loads(out):
              for k in ("dependencies", "devDependencies"):
                  deps.update({n: v["version"] for n, v in (proj.get(k) or {}).items()})
          pairs = {"@tauri-apps/api": "tauri"}
          for n in deps:
              if n.startswith("@tauri-apps/plugin-"):
                  pairs[n] = "tauri-" + n.split("/", 1)[1]
          bad = []
          for js, rs in pairs.items():
              jv, rv = deps.get(js), crate(rs)
              print(f"{js} {jv}  ·  {rs} {rv}")
              if jv and rv and jv.split(".")[:2] != rv.split(".")[:2]:
                  bad.append(f"{js} {jv} vs {rs} {rv}")
          assert not bad, "major.minor differ (tauri build refuses this): " + "; ".join(bad)
          PY

      - name: Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Shell syntax
        run: |
          bash -n PKGBUILD
          bash -n scripts/gen-icons.sh

[package]
name = "ewe-player"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ewe Player — video and music on the ewe desktop"

[lib]
name = "ewe_player"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
ewe-app-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# GTK file chooser for Open file / folder / Load subtitles / Save playlist
# Open/Save through the portal, so ewe's file picker draws it (ewe RFC-011);
# the default "gtk3" feature drew GTK's dialog inside this app instead
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
# org.mpris.MediaPlayer2.ewe-player on the session bus (zbus underneath, which also
# does the org.freedesktop.ScreenSaver Inhibit call)
mpris-server = { version = "0.11", features = ["tokio"] }
# tags, durations and embedded covers for the music library
lofty = "0.22"
percent-encoding = "2"
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"


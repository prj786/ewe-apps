[package]
name = "ewe-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ewe Viewer — documents and pictures on the ewe desktop"

[lib]
name = "ewe_viewer"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
ewe-app-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-dialog = "2"
# comics: CBZ pages straight from the archive (CBR/CB7 go through bsdtar / unar / 7z)
zip = { version = "9", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }
# GIO for Trash and opening URLs (already linked by Tauri's GTK)
gio = "0.18"
glib = "0.18"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
